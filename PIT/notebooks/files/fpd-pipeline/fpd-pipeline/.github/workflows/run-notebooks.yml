name: 🚀 Executar Notebooks & Publicar Dashboard

on:
  push:
    branches: [main, dev]
    paths:
      - 'notebooks/**'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-notebooks:
    name: ⚙️ Executar Pipeline de Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install nbconvert nbformat jupyter ipykernel papermill

      - name: 📁 Criar diretórios de saída
        run: |
          mkdir -p outputs/figures
          mkdir -p data/processed

      - name: 📓 Executar dev3_metrics.ipynb
        run: |
          papermill notebooks/dev3_metrics.ipynb outputs/executed/dev3_metrics_out.ipynb \
            --log-output \
            --no-progress-bar \
            2>&1 | tee outputs/logs/dev3_metrics.log || echo "⚠️ dev3_metrics falhou, continuando..."
        continue-on-error: true

      - name: 📓 Executar dev3_pitch_modulos5a9.ipynb
        run: |
          papermill notebooks/dev3_pitch_modulos5a9.ipynb outputs/executed/dev3_pitch_modulos5a9_out.ipynb \
            --log-output \
            --no-progress-bar \
            2>&1 | tee outputs/logs/dev3_pitch_modulos5a9.log || echo "⚠️ dev3_pitch_modulos5a9 falhou, continuando..."
        continue-on-error: true

      - name: 📓 Executar dev3_pitch_completo.ipynb
        run: |
          papermill notebooks/dev3_pitch_completo.ipynb outputs/executed/dev3_pitch_completo_out.ipynb \
            --log-output \
            --no-progress-bar \
            2>&1 | tee outputs/logs/dev3_pitch_completo.log || echo "⚠️ dev3_pitch_completo falhou, continuando..."
        continue-on-error: true

      - name: 📊 Gerar relatório de execução
        run: python scripts/generate_report.py

      - name: 🌐 Copiar dashboard para gh-pages
        run: |
          cp -r web/* outputs/report/
          cp -r outputs/figures outputs/report/figures 2>/dev/null || true
          cp outputs/metricas.json outputs/report/metricas.json 2>/dev/null || echo "{}" > outputs/report/metricas.json
          cp outputs/run_meta.json outputs/report/run_meta.json 2>/dev/null || true
          cp outputs/decil_data.json outputs/report/decil_data.json 2>/dev/null || echo "[]" > outputs/report/decil_data.json

      - name: 📤 Upload artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/report

  deploy-pages:
    name: 🌐 Deploy GitHub Pages
    needs: run-notebooks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
